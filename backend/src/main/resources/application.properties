spring.application.name=blooming-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:blooming}
spring.datasource.username=${POSTGRES_USER:blooming}
spring.datasource.password=${POSTGRES_PASSWORD:blooming_local_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info